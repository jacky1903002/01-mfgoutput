<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MFG Output Analysis - 專案進度與分析系統</title>
  
  <!-- Font Awesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- SheetJS (Excel 匯入) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Chart.js (圖表繪製) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- html2canvas (圖表匯出 PNG) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- 引入外部 CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="header-title-group">
      <div class="logo-container" id="logo-box" onclick="changeLogoUrl()" title="點擊輸入圖片網址">
        <i class="fa-solid fa-chart-line" id="logo-icon"></i>
      </div>
      <div>
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="badge-enterprise">CLOUD ENTERPRISE</span>
          <span id="firebase-status" class="status-badge loading">● Firebase 連線中...</span>
        </div>
        <h1 class="system-title">MFG Output Analysis</h1>
      </div>
    </div>

    <div class="user-profile-bar">
      <span id="user-name" class="user-name"><i class="fa-solid fa-user-check"></i> <span id="user-email-text"></span></span>
      <button id="auth-btn" class="btn btn-light">
        <i class="fa-solid fa-right-to-bracket"></i> <span id="auth-btn-text">管理員登入</span>
      </button>
    </div>
  </header>

  <div class="nav-tabs-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
      <span style="font-size: 12px; font-weight: bold; color: #64748b;">工作表清單：</span>
      <label id="btn-import-excel" class="btn btn-light" style="cursor:pointer;">
        <i class="fa-solid fa-file-import"></i> 匯入 Excel 至當前工作表
        <input type="file" id="upload-excel" accept=".xlsx, .xls" style="display: none;">
      </label>
    </div>
    
    <div class="sheet-tabs" id="sheet-tabs-list"></div>
    <button id="btn-add-tab" class="btn-add-tab" onclick="addNewSheet()"><i class="fa-solid fa-plus"></i> 新增工作表</button>
  </div>

  <div class="content-container" id="main-content"></div>

  <!-- 管理員登入 Modal -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal-card">
      <div class="modal-title"><i class="fa-solid fa-lock"></i> 管理員登入</div>
      <div class="form-group">
        <label>電子郵件 (Email)</label>
        <input type="email" id="login-email" placeholder="n1693131@gmail.com" />
      </div>
      <div class="form-group">
        <label>密碼 (Password)</label>
        <input type="password" id="login-password" placeholder="請輸入密碼" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-light" onclick="closeLoginModal()">取消</button>
        <button class="btn" id="do-login-btn">登入</button>
      </div>
    </div>
  </div>

  <!-- 引入外部 JavaScript -->
  <script type="module" src="script.js"></script>
</body>
</html>
