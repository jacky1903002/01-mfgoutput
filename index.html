<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>資料分析與圖表儀表板</title>
  <!-- 引入外部資源 (FontAwesome, Chart.js, html2canvas) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .charts-section-title { font-size: 20px; font-weight: bold; margin: 20px 0 15px 0; display: flex; align-items: center; gap: 8px; color: #38bdf8; }
    .charts-grid, .charts-grid-2col { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .chart-page { background: #1e293b; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1px solid #334155; }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .chart-title { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; color: #e2e8f0; }
    .chart-wrapper { position: relative; height: 350px; width: 100%; }
    .btn { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; transition: background 0.2s; }
    .btn-success { background: #10b981; color: white; }
    .btn-success:hover { background: #059669; }
  </style>
</head>
<body>

  <div id="dashboard-container"></div>

  <script>
    // 1. 定義各工作頁的圖表設定與全域實例變數
    window.chartInstances = {};
    window.sheet1ChartConfigs = [
      { id: 's1_c1', type: 'combo', title: '產能量能分析總覽' },
      { id: 's1_c2', type: 'line', title: '稼動率趨勢', dataKey: '稼動率' }
    ];
    window.sheet2ChartConfigs = [
      { id: 's2_c1', type: 'combo_bar_line', title: '鎢鉬鈹刀具費金額與佔比趨勢圖', barKey: '鎢鉬鈹刀具費', lineKey: '鎢鉬鈹刀具費/成本' },
      { id: 's2_c2', type: 'double_line', title: '鎢鉬鈹刀具費與成本趨勢圖', line1Key: '鎢鉬鈹刀具費', line2Key: '鎢鉬產品成本' }
    ];
    window.sheet3ChartConfigs = [
      { id: 's3_c1', type: 'line', title: '複材占比趨勢圖', dataKey: '複材占比' }
    ];

    // 2. 主渲染邏輯
    function renderDashboard(currentSheet) {
      const container = document.getElementById('dashboard-container');
      if (!container) return;
      let html = '';

      const isFirstSheet = (currentSheet.id === "s1" || currentSheet.name === "產能量能分析");
      const isSecondSheet = (currentSheet.id === "s2" || currentSheet.name === "刀具費佔成本");
      const isThirdSheet = (currentSheet.id === "s3" || currentSheet.name === "複材占比" || currentSheet.name === "植村占比");
      const isFourthSheet = (currentSheet.id === "s4" || currentSheet.name === "各客戶累積產值");

      if (isFirstSheet && currentSheet.data && currentSheet.data.length > 0) {
        html += `<div class="charts-section-title"><i class="fa-solid fa-chart-line"></i> 分析圖表</div><div class="charts-grid">`;
        window.sheet1ChartConfigs.forEach(cp => {
          html += `
            <div class="chart-page" id="export-area-${cp.id}">
              <div class="chart-header">
                <div class="chart-title"><i class="fa-solid fa-chart-area" style="color:#7e22ce;"></i> ${cp.title}</div>
                <button class="btn btn-success" onclick="exportChartToPNG('${cp.id}', '${cp.title}')"><i class="fa-solid fa-download"></i> 匯出 PNG</button>
              </div>
              <div class="chart-wrapper"><canvas id="canvas-${cp.id}"></canvas></div>
            </div>
          `;
        });
        html += `</div>`;
      } else if (isSecondSheet && currentSheet.data && currentSheet.data.length > 0) {
        html += `<div class="charts-section-title"><i class="fa-solid fa-chart-pie"></i> 刀具費與成本趨勢分析</div><div class="charts-grid-2col">`;
        window.sheet2ChartConfigs.forEach(cp => {
          html += `
            <div class="chart-page" id="export-area-${cp.id}">
              <div class="chart-header">
                <div class="chart-title"><i class="fa-solid fa-chart-column" style="color:#0284c7;"></i> ${cp.title}</div>
                <button class="btn btn-success" onclick="exportChartToPNG('${cp.id}', '${cp.title}')"><i class="fa-solid fa-download"></i> 匯出 PNG</button>
              </div>
              <div class="chart-wrapper"><canvas id="canvas-${cp.id}"></canvas></div>
            </div>
          `;
        });
        html += `</div>`;
      } else if (isThirdSheet && currentSheet.data && currentSheet.data.length > 0) {
        html += `<div class="charts-section-title"><i class="fa-solid fa-chart-pie"></i> 複材與植村占比分析</div><div class="charts-grid">`;
        window.sheet3ChartConfigs.forEach(cp => {
          html += `
            <div class="chart-page" id="export-area-${cp.id}">
              <div class="chart-header">
                <div class="chart-title"><i class="fa-solid fa-chart-pie" style="color:#10b981;"></i> ${cp.title}</div>
                <button class="btn btn-success" onclick="exportChartToPNG('${cp.id}', '${cp.title}')"><i class="fa-solid fa-download"></i> 匯出 PNG</button>
              </div>
              <div class="chart-wrapper"><canvas id="canvas-${cp.id}"></canvas></div>
            </div>
          `;
        });
        html += `</div>`;
      } else if (isFourthSheet && currentSheet.data && currentSheet.data.length > 0) {
        html += `
          <div class="charts-section-title"><i class="fa-solid fa-chart-pie"></i> 2026 各客戶累積產值佔比 (Treemap)</div>
          <div class="chart-page" id="export-area-s4_treemap" style="max-width: 100%; margin-bottom: 30px;">
            <div class="chart-header">
              <div class="chart-title"><i class="fa-solid fa-border-all" style="color:#2563eb;"></i> 2026 各客戶累積產值</div>
              <button class="btn btn-success" onclick="exportChartToPNG('s4_treemap', '2026 各客戶累積產值佔比')"><i class="fa-solid fa-download"></i> 匯出 PNG</button>
            </div>
            <div id="treemap-container" style="width: 100%; height: 620px; background: #1e293b; border-radius: 8px; padding: 12px; display: flex; flex-wrap: wrap; position: relative; gap: 4px; overflow: hidden;"></div>
          </div>
        `;
      }

      container.innerHTML = html;

      // 3. 延遲觸發圖表建構
      if (isFirstSheet && currentSheet.data && currentSheet.data.length > 0) {
        setTimeout(() => { window.sheet1ChartConfigs.forEach(cp => buildChartSheet1(cp, currentSheet)); }, 100);
      } else if (isSecondSheet && currentSheet.data && currentSheet.data.length > 0) {
        setTimeout(() => { window.sheet2ChartConfigs.forEach(cp => buildChartSheet2(cp, currentSheet)); }, 100);
      } else if (isThirdSheet && currentSheet.data && currentSheet.data.length > 0) {
        setTimeout(() => { window.sheet3ChartConfigs.forEach(cp => buildChartSheet3(cp, currentSheet)); }, 100);
      } else if (isFourthSheet && currentSheet.data && currentSheet.data.length > 0) {
        setTimeout(() => { renderTreemap(currentSheet); }, 100);
      }
    }

    // Treemap 渲染函數
    function renderTreemap(sheet) {
      const container = document.getElementById('treemap-container');
      if (!container) return;
      let items = sheet.data.map(row => {
        const cust = row.customer || row.客戶 || '未知';
        const totalVal = parseNum(row.total || row.總計 || 0);
        return { customer: cust, value: totalVal };
      }).filter(item => item.value > 0);

      items.sort((a, b) => b.value - a.value);
      const grandTotal = items.reduce((sum, item) => sum + item.value, 0);
      const colors = ['#1d4ed8', '#b91c1c', '#b45309', '#047857', '#0e7490', '#6d28d9', '#be185d', '#334155', '#475569', '#0284c7', '#0d9488'];

      let html = '';
      items.forEach((item, idx) => {
        const percentage = grandTotal > 0 ? ((item.value / grandTotal) * 100).toFixed(2) + '%' : '0%';
        const bg = colors[idx % colors.length];
        let flexGrow = Math.max(Math.round((item.value / grandTotal) * 100), 4);
        html += `
          <div style="flex: ${flexGrow} 1 ${flexGrow > 20 ? '40%' : '18%'}; background: ${bg}; border-radius: 6px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15); min-height: 90px;">
            <div style="font-size: 22px; font-weight: bold; letter-spacing: 0.5px;">${percentage}</div>
            <div style="font-size: 16px; font-weight: 600; opacity: 0.95;">${item.customer}</div>
          </div>
        `;
      });
      container.style.height = '620px';
      container.innerHTML = html;
    }

    // 年份區隔外掛插件
    const yearSeparatorPlugin = {
      id: 'yearSeparatorPlugin',
      afterDraw(chart) {
        const { ctx, chartArea: { top, bottom }, scales: { x } } = chart;
        if (!x) return;
        const labels = chart.data.labels || [];
        const yearGroups = {};
        labels.forEach((lbl, idx) => {
          const yrMatch = String(lbl).match(/\d{2}$/);
          const yr = yrMatch ? yrMatch[0] : 'Other';
          if (!yearGroups[yr]) yearGroups[yr] = [];
          yearGroups[yr].push(idx);
        });
        const yearKeys = Object.keys(yearGroups);
        ctx.save();
        yearKeys.forEach((yr, keyIdx) => {
          if (keyIdx > 0) {
            const prevLastIdx = yearGroups[yearKeys[keyIdx - 1]].slice(-1)[0];
            const currFirstIdx = yearGroups[yr][0];
            const prevLastX = x.getPixelForValue(prevLastIdx);
            const currFirstX = x.getPixelForValue(currFirstIdx);
            const separatorX = (prevLastX + currFirstX) / 2;
            ctx.beginPath();
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1.5;
            ctx.moveTo(separatorX, top);
            ctx.lineTo(separatorX, bottom);
            ctx.stroke();
          }
        });
        ctx.restore();
      }
    };

    // 數值解析與模糊欄位對應
    function parseNum(val, isPercentageHint = false) {
      if (val === undefined || val === null || val === "-" || val === "") return 0;
      let str = String(val).trim();
      let hasPercentSign = str.includes('%');
      str = str.replace(/[^0-9.-]/g, '');
      let num = parseFloat(str);
      if (isNaN(num)) return 0;
      if (hasPercentSign) return num;
      else if (isPercentageHint && Math.abs(num) <= 1.0 && num !== 0) return num * 100;
      return num;
    }

    function getColumnKeyByTitle(sheet, targetTitle) {
      if (!sheet || !sheet.columns) return null;
      let found = sheet.columns.find(c => c.key === targetTitle || c.title.trim() === targetTitle.trim());
      if (found) return found.key;
      const normalize = (str) => String(str).replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, "").toLowerCase();
      const cleanTarget = normalize(targetTitle);
      found = sheet.columns.find(c => normalize(c.title).includes(cleanTarget) || cleanTarget.includes(normalize(c.title)));
      return found ? found.key : null;
    }

    function resolveKey(sheet, primaryKey, fallbackTitles) {
      if (primaryKey) {
        const foundKey = getColumnKeyByTitle(sheet, primaryKey);
        if (foundKey) return foundKey;
      }
      if (Array.isArray(fallbackTitles)) {
        for (let title of fallbackTitles) {
          const foundKey = getColumnKeyByTitle(sheet, title);
          if (foundKey) return foundKey;
        }
      }
      return primaryKey;
    }

    // 各工作頁圖表建構函數
    function buildChartSheet1(config, sheet) {
      const canvas = document.getElementById(`canvas-${config.id}`);
      if (!canvas) return;
      if (window.chartInstances[config.id]) window.chartInstances[config.id].destroy();

      const monthColKey = getColumnKeyByTitle(sheet, "月份") || getColumnKeyByTitle(sheet, "時間") || "month";
      const labels = sheet.data.map(r => r[monthColKey] || r.month || '');

      if (config.type === "combo") {
        const valKey = getColumnKeyByTitle(sheet, "合計產出市值");
        const qtyKey = getColumnKeyByTitle(sheet, "合計產出數量");
        const valData = sheet.data.map(r => parseNum(r[valKey]));
        const qtyData = sheet.data.map(r => parseNum(r[qtyKey]));

        window.chartInstances[config.id] = new Chart(canvas, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [
              { type: 'bar', label: '合計產出市值(NT$)', data: valData, backgroundColor: 'rgba(59, 130, 246, 0.75)', borderColor: '#3b82f6', borderWidth: 1, yAxisID: 'y' },
              { type: 'line', label: '合計產出數量(PCS)', data: qtyData, borderColor: '#ef4444', backgroundColor: '#ef4444', borderWidth: 2, tension: 0.2, pointRadius: 4, yAxisID: 'y1' }
            ]
          },
          plugins: [yearSeparatorPlugin],
          options: {
            responsive: true, maintainAspectRatio: false,
            scales: {
              x: { grid: { display: false } },
              y: { type: 'linear', display: true, position: 'left', title: { display: true, text: '市值 (NT$)' } },
              y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: '數量 (PCS)' } }
            }
          }
        });
      } else if (config.type === "line") {
        const dataKey = getColumnKeyByTitle(sheet, config.dataKey);
        const lineData = sheet.data.map(r => parseNum(r[dataKey], true));
        window.chartInstances[config.id] = new Chart(canvas, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{ label: config.dataKey, data: lineData, borderColor: '#8b5cf6', backgroundColor: 'rgba(139, 92, 246, 0.1)', fill: true, borderWidth: 2, tension: 0.2, pointRadius: 4 }]
          },
          plugins: [yearSeparatorPlugin],
          options: {
            responsive: true, maintainAspectRatio: false,
            scales: {
              x: { grid: { display: false } },
              y: { ticks: { callback: function(value) { return value + '%'; } } }
            }
          }
        });
      }
    }

    function buildChartSheet2(config, sheet) {
      const canvas = document.getElementById(`canvas-${config.id}`);
      if (!canvas) return;
      if (window.chartInstances[config.id]) window.chartInstances[config.id].destroy();

      const monthColKey = getColumnKeyByTitle(sheet, "月份") || getColumnKeyByTitle(sheet, "時間") || "month";
      const labels = sheet.data.map(r => r[monthColKey] || r.month || '');

      if (config.type === "combo_bar_line") {
        const barKey = resolveKey(sheet, config.barKey, [config.title, "刀具費", "金額"]);
        const lineKey = resolveKey(sheet, config.lineKey, ["佔比", "比率", "%"]);
        const barData = sheet.data.map(r => parseNum(r[barKey]));
        const lineData = sheet.data.map(r => parseNum(r[lineKey], true));

        window.chartInstances[config.id] = new Chart(canvas, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [
              { type: 'bar', label: config.barKey || '刀具費', data: barData, backgroundColor: 'rgba(2, 132, 199, 0.75)', borderColor: '#0284c7', borderWidth: 1, yAxisID: 'y' },
              { type: 'line', label: config.lineKey || '佔比', data: lineData, borderColor: '#f59e0b', backgroundColor: '#f59e0b', borderWidth: 2, tension: 0.2, pointRadius: 4, yAxisID: 'y1' }
            ]
          },
          plugins: [yearSeparatorPlugin],
          options: {
            responsive: true, maintainAspectRatio: false,
            scales: {
              x: { grid: { display: false } },
              y: { type: 'linear', display: true, position: 'left', title: { display: true, text: '金額 (NT$)' } },
              y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, ticks: { callback: function(v) { return v + '%'; } }, title: { display: true, text: '佔比 (%)' } }
            }
          }
        });
      } else if (config.type === "double_line") {
        const line1Key = resolveKey(sheet, config.line1Key, [config.title, "刀具費", "金額"]);
        const line2Key = resolveKey(sheet, config.line2Key, ["成本", "產品成本"]);
        const data1 = sheet.data.map(r => parseNum(r[line1Key]));
        const data2 = sheet.data.map(r => parseNum(r[line2Key]));

        window.chartInstances[config.id] = new Chart(canvas, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              { label: config.line1Key || '數值 1', data: data1, borderColor: '#06b6d4', backgroundColor: '#06b6d4', borderWidth: 2, tension: 0.2, pointRadius: 4 },
              { label: config.line2Key || '數值 2', data: data2, borderColor: '#10b981', backgroundColor: '#10b981', borderWidth: 2, tension: 0.2, pointRadius: 4 }
            ]
          },
          plugins: [yearSeparatorPlugin],
          options: {
            responsive: true, maintainAspectRatio: false,
            scales: {
              x: { grid: { display: false } },
              y: { type: 'linear', display: true, title: { display: true, text: '金額 (NT$)' } }
            }
          }
        });
      }
    }

    function buildChartSheet3(config, sheet) {
      const canvas = document.getElementById(`canvas-${config.id}`);
      if (!canvas) return;
      if (window.chartInstances[config.id]) window.chartInstances[config.id].destroy();

      const monthColKey = getColumnKeyByTitle(sheet, "月份") || getColumnKeyByTitle(sheet, "時間") || "month";
      const labels = sheet.data.map(r => r[monthColKey] || r.month || '');
      const dataKey = resolveKey(sheet, config.dataKey, [config.title, "占比", "比率", "複材占比", "植村占比"]);
      const chartData = sheet.data.map(r => parseNum(r[dataKey], true));

      window.chartInstances[config.id] = new Chart(canvas, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{ label: config.title || '占比', data: chartData, borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.1)', fill: true, borderWidth: 2, tension: 0.2, pointRadius: 4 }]
        },
        plugins: [yearSeparatorPlugin],
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: {
            x: { grid: { display: false } },
            y: { ticks: { callback: function(value) { return value + '%'; } } }
          }
        }
      });
    }

    // 匯出 PNG 功能
    window.exportChartToPNG = function(chartId, title) {
      const element = document.getElementById(`export-area-${chartId}`);
      if (!element) return;
      html2canvas(element, { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = `${title.replace(/[^\w\u4e00-\u9fa5]/g, '_')}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(err => {
        alert("匯出圖片失敗，請稍後再試！");
      });
    };

    // 範例測試呼叫：切換至工作表 2 進行預覽
    const sampleSheet2 = {
      id: "s2",
      name: "刀具費佔成本",
      columns: [
        { key: "month", title: "月份" },
        { key: "鎢鉬鈹刀具費", title: "鎢鉬鈹刀具費" },
        { key: "鎢鉬鈹刀具費/成本", title: "鎢鉬鈹刀具費/成本" },
        { key: "鎢鉬產品成本", title: "鎢鉬產品成本" }
      ],
      data: [
        { month: "2025/01", "鎢鉬鈹刀具費": 15000, "鎢鉬鈹刀具費/成本": 0.03, "鎢鉬產品成本": 500000 },
        { month: "2025/02", "鎢鉬鈹刀具費": 18000, "鎢鉬鈹刀具費/成本": 0.035, "鎢鉬產品成本": 510000 },
        { month: "2026/01", "鎢鉬鈹刀具費": 16000, "鎢鉬鈹刀具費/成本": 0.031, "鎢鉬產品成本": 520000 }
      ]
    };

    // 頁面載入後自動渲染範例
    window.onload = function() {
      renderDashboard(sampleSheet2);
    };
  </script>
</body>
</html>
