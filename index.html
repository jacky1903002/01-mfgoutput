<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filament Outsource Tracing - 專案進度追蹤系統</title>
  
  <!-- Font Awesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- SheetJS (用於 Excel 匯入匯出) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #060b19;
      color: #94a3b8;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 頂部 Header 區塊 */
    header {
      background-color: #0b132b;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
    }
    .header-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: #0284c7;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .badge-enterprise {
      background: #4f46e5;
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .badge-time {
      background: #1e293b;
      color: #38bdf8;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid #0284c7;
    }
    h1.system-title {
      color: #38bdf8;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .user-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    /* 按鈕元件樣式 */
    .btn {
      background-color: #0284c7;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn:hover { background-color: #0369a1; }
    .btn-dark { background-color: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    .btn-dark:hover { background-color: #334155; color: #fff; }
    .btn-danger { background-color: #ef4444; }
    .btn-danger:hover { background-color: #dc2626; }

    /* 專案與工作表標籤區 */
    .nav-tabs-container {
      background-color: #0b132b;
      padding: 8px 24px 0 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .project-tag {
      align-self: flex-start;
      background: #0284c7;
      color: #fff;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    .sheet-tabs {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .tab-item {
      background: #151e3d;
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 6px 6px 0 0;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #1e293b;
      border-bottom: none;
    }
    .tab-item.active {
      background: #0284c7;
      color: #fff;
    }

    /* 操作工具列 */
    .action-bar {
      background-color: #0d1733;
      padding: 10px 24px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #1e293b;
    }

    /* 表格主要區塊 */
    .table-container {
      flex: 1;
      overflow: auto;
      padding: 0 24px 24px 24px;
      background-color: #080f23;
    }
    table.custom-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      color: #cbd5e1;
      text-align: left;
    }
    table.custom-table th {
      background-color: #0f1938;
      color: #94a3b8;
      padding: 12px 8px;
      border-bottom: 1px solid #1e293b;
      white-space: nowrap;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    table.custom-table th .close-col {
      color: #64748b;
      margin-left: 4px;
      cursor: pointer;
    }
    table.custom-table th .close-col:hover { color: #ef4444; }
    table.custom-table td {
      padding: 10px 8px;
      border-bottom: 1px solid #151f38;
      white-space: nowrap;
    }
    table.custom-table tr:hover {
      background-color: #111c3e;
    }

    /* 進度條樣式 */
    .progress-box {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 120px;
    }
    .progress-bar-bg {
      flex: 1;
      height: 8px;
      background-color: #1e293b;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 4px;
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.5);
    }
    .progress-text {
      font-size: 11px;
      color: #38bdf8;
      font-weight: bold;
      width: 35px;
      text-align: right;
    }

    /* 狀態標籤 */
    .status-tag {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }
    .status-ongoing { color: #38bdf8; }
    .status-notstart { color: #94a3b8; }

    /* 操作鏈結 */
    .action-link {
      color: #64748b;
      cursor: pointer;
    }
    .action-link:hover { color: #ef4444; }

    /* Modal 彈窗樣式 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); z-index: 2000;
      display: none; justify-content: center; align-items: center;
    }
    .modal-content {
      background: #0f172a; border: 1px solid #1e293b; padding: 24px; border-radius: 8px; width: 340px;
      display: flex; flex-direction: column; gap: 14px; color: #fff;
    }
    .modal-content input {
      padding: 8px 12px; background: #1e293b; border: 1px solid #334155; border-radius: 4px; color: #fff; font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- 頂部標題列 -->
  <header>
    <div class="header-title-group">
      <div class="logo-icon"><i class="fa-solid fa-microchip"></i></div>
      <div>
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="badge-enterprise">CLOUD ENTERPRISE</span>
          <span class="badge-time">● 最後更新: <span id="update-time">2026/09/23 13:17:58</span></span>
        </div>
        <h1 class="system-title">Filament Outsource Tracing</h1>
      </div>
    </div>

    <!-- 使用者驗證資訊 -->
    <div class="user-controls">
      <span id="user-info">載入中...</span>
      <button id="btn-login" onclick="openAuthModal()" class="btn">🔑 帳號登入/註冊</button>
      <button id="btn-logout" onclick="logout()" class="btn btn-danger" style="display: none;">登出</button>
    </div>
  </header>

  <!-- 工作表分頁區 -->
  <div class="nav-tabs-container">
    <div class="project-tag">專案進度追蹤表</div>
    <div class="sheet-tabs">
      <div class="tab-item active">工程及製造追蹤項目 <i class="fa-solid fa-xmark"></i></div>
      <div class="tab-item">採購追蹤項目 <i class="fa-solid fa-xmark"></i></div>
      <div class="tab-item">品保追蹤項目 <i class="fa-solid fa-xmark"></i></div>
      <button class="btn btn-dark" style="padding: 4px 8px;">新增工作表</button>
      <button class="btn btn-dark" style="padding: 4px 8px;">複製工作表</button>
    </div>
  </div>

  <!-- 功能按鈕列 -->
  <div class="action-bar">
    <button class="btn" onclick="addRow()"><i class="fa-solid fa-plus"></i> 新增列</button>
    <button class="btn" onclick="addColumn()"><i class="fa-solid fa-plus"></i> 新增自訂欄位</button>
    <button class="btn btn-dark" onclick="exportExcel()"><i class="fa-solid fa-file-excel"></i> 匯出 Excel</button>
    <label class="btn btn-dark" style="cursor:pointer;">
      <i class="fa-solid fa-file-import"></i> 匯入 Excel
      <input type="file" id="upload-excel" accept=".xlsx, .xls" style="display: none;">
    </label>
    <button id="btn-save" class="btn btn-dark" onclick="saveToFirebase()" disabled><i class="fa-solid fa-cloud-arrow-up"></i> 雲端儲存</button>
  </div>

  <!-- 主數據表格區塊 -->
  <div class="table-container">
    <table class="custom-table" id="main-table">
      <thead>
        <tr>
          <th style="width: 30px;">:::</th>
          <th>品號 <span class="close-col">×</span></th>
          <th>貨號 <span class="close-col">×</span></th>
          <th>採購料號 <span class="close-col">×</span></th>
          <th>圖面進度% <span class="close-col">×</span></th>
          <th>K料號申請 <span class="close-col">×</span></th>
          <th>檢具進度 <span class="close-col">×</span></th>
          <th>開始日期 <span class="close-col">×</span></th>
          <th>結束日期 <span class="close-col">×</span></th>
          <th>進度(%) <span class="close-col">×</span></th>
          <th>狀態 <span class="close-col">×</span></th>
          <th>備註 <span class="close-col">×</span></th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- 內容將由 JavaScript 自動生成 -->
      </tbody>
    </table>
  </div>

  <!-- 登入與註冊 Modal -->
  <div id="auth-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 id="auth-title" style="text-align:center;">使用者登入</h3>
      <input type="email" id="auth-email" placeholder="電子郵件 (Email)" autocomplete="email">
      <input type="password" id="auth-password" placeholder="密碼" autocomplete="current-password">
      <div style="display:flex; gap:8px;">
        <button id="auth-submit-btn" class="btn" style="flex:1; justify-content:center;" onclick="handleAuthSubmit()">登入</button>
        <button class="btn btn-dark" style="flex:1; justify-content:center;" onclick="closeAuthModal()">取消</button>
      </div>
      <div style="font-size:12px; color:#38bdf8; text-align:center; cursor:pointer;" onclick="toggleAuthMode()" id="auth-toggle-btn">還沒有帳號？按此註冊</div>
    </div>
  </div>

  <!-- Firebase v10 SDK Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyARVVuOfxBRx5BfQ0oEY7bfjuA_DmQQBV0",
      authDomain: "mfgoutput.firebaseapp.com",
      projectId: "mfgoutput",
      storageBucket: "mfgoutput.firebasestorage.app",
      messagingSenderId: "251776937464",
      appId: "1:251776937464:web:63f08c2e1e9edaa2c5fa0d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let isRegisterMode = false;

    // 監聽 Auth 狀態
    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      const userInfo = document.getElementById('user-info');
      const btnLogin = document.getElementById('btn-login');
      const btnLogout = document.getElementById('btn-logout');
      const btnSave = document.getElementById('btn-save');

      if (user) {
        userInfo.innerText = user.email;
        btnLogin.style.display = 'none';
        btnLogout.style.display = 'inline-block';
        btnSave.disabled = false;
        await loadFromFirebase();
      } else {
        userInfo.innerText = 'n1693131@gmail.com'; // 靜態展示預設
        btnLogin.style.display = 'inline-block';
        btnLogout.style.display = 'none';
        btnSave.disabled = true;
      }
    });

    window.openAuthModal = () => document.getElementById('auth-modal').style.display = 'flex';
    window.closeAuthModal = () => document.getElementById('auth-modal').style.display = 'none';

    window.toggleAuthMode = () => {
      isRegisterMode = !isRegisterMode;
      document.getElementById('auth-title').innerText = isRegisterMode ? '註冊新帳號' : '使用者登入';
      document.getElementById('auth-submit-btn').innerText = isRegisterMode ? '註冊' : '登入';
      document.getElementById('auth-toggle-btn').innerText = isRegisterMode ? '已有帳號？按此登入' : '還沒有帳號？按此註冊';
    };

    window.handleAuthSubmit = async () => {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      if (!email || !password) return alert('請輸入完整 Email 與密碼！');

      try {
        if (isRegisterMode) {
          await createUserWithEmailAndPassword(auth, email, password);
          alert('註冊成功！');
        } else {
          await signInWithEmailAndPassword(auth, email, password);
          alert('登入成功！');
        }
        closeAuthModal();
      } catch (err) {
        alert('操作失敗：' + err.message);
      }
    };

    window.logout = () => signOut(auth);

    // 儲存至雲端 (以使用者 UID 做個人隔離)
    window.saveToFirebase = async () => {
      if (!currentUser) return;
      try {
        const tableData = getTableData();
        await setDoc(doc(db, "users", currentUser.uid, "sheets", "tracing_data"), {
          data: JSON.stringify(tableData),
          updatedAt: new Date().toISOString()
        });
        alert('☁️ 已成功同步儲存至雲端！');
      } catch (err) {
        alert('儲存失敗：' + err.message);
      }
    };

    // 從雲端載入
    window.loadFromFirebase = async () => {
      if (!currentUser) return;
      try {
        const docRef = doc(db, "users", currentUser.uid, "sheets", "tracing_data");
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          const rawData = JSON.parse(docSnap.data().data);
          renderTable(rawData);
        }
      } catch (err) {
        console.error('雲端載入錯誤:', err);
      }
    };
  </script>

  <!-- 數據呈現與介面互動腳本 -->
  <script>
    // 預設擬真數據（對照圖片內容）
    const initialData = [
      { pinNo: "FVSE-0036-4", itemNo: "10091-VWNE000", poNo: "50091-0WNE000", drawProgress: 100, kApp: "Y", checkProgress: 0, startDate: "2026-03-01", endDate: "2026-12-31", progress: 70, status: "進行中", remark: "-" },
      { pinNo: "FVSE-0525-4", itemNo: "10021-VWNE000", poNo: "50021-0WNE000", drawProgress: 100, kApp: "Y", checkProgress: 0, startDate: "2026-03-01", endDate: "2026-12-31", progress: 70, status: "進行中", remark: "-" },
      { pinNo: "FVSE-0032-4", itemNo: "14967-VWNE001", poNo: "54967-0WNG000", drawProgress: 100, kApp: "-", checkProgress: 0, startDate: "2026-03-01", endDate: "2026-12-31", progress: 70, status: "未開始", remark: "-" },
      { pinNo: "FVSE-0068", itemNo: "10014-VWTE000", poNo: "50014-0WTE000", drawProgress: 100, kApp: "NA", checkProgress: 0, startDate: "2026-03-01", endDate: "2026-12-31", progress: 70, status: "未開始", remark: "無須檢具" },
      { pinNo: "FV80-0433", itemNo: "10207-FWTE000", poNo: "50207-0WTE000", drawProgress: 100, kApp: "-", checkProgress: 0, startDate: "2026-03-01", endDate: "2026-12-31", progress: 70, status: "未開始", remark: "-" },
      { pinNo: "FVSE-0471-6", itemNo: "10024-VWNE000", poNo: "50024-0WNE000", drawProgress: 70, kApp: "-", checkProgress: 0, startDate: "2026-03-01", endDate: "2026-12-31", progress: 0, status: "未開始", remark: "待QC逆向!(09/29)" },
      { pinNo: "FVEX-3030M", itemNo: "14725-FWNE000", poNo: "54725-0WNE000", drawProgress: 100, kApp: "NA", checkProgress: 0, startDate: "2026-03-01", endDate: "2026-12-31", progress: 0, status: "未開始", remark: "無須檢具" },
      { pinNo: "FV810-0206WU", itemNo: "10247-FWUE000", poNo: "50247-0WUE000", drawProgress: 70, kApp: "-", checkProgress: 0, startDate: "2026-03-01", endDate: "2026-12-31", progress: 0, status: "未開始", remark: "待QC逆向!(09/29)" },
      { pinNo: "-", itemNo: "10031-FWTE001", poNo: "50031-0WTE000", drawProgress: 100, kApp: "Y", checkProgress: 0, startDate: "2026-03-01", endDate: "2026-12-31", progress: 0, status: "未開始", remark: "10091-VWEN000檢具共用" },
      { pinNo: "FVSE-0480-1", itemNo: "13876-VWNE000", poNo: "53876-0WNE000", drawProgress: 0, kApp: "-", checkProgress: 0, startDate: "2026-03-01", endDate: "2026-12-31", progress: 0, status: "未開始", remark: "-" }
    ];

    function renderProgress(val) {
      return `
        <div class="progress-box">
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${val}%"></div>
          </div>
          <span class="progress-text">${val}%</span>
        </div>
      `;
    }

    function renderTable(data) {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      data.forEach((row, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="color:#475569;"><i class="fa-solid fa-grip-vertical"></i></td>
          <td>${row.pinNo}</td>
          <td>${row.itemNo}</td>
          <td>${row.poNo}</td>
          <td>${renderProgress(row.drawProgress)}</td>
          <td>${row.kApp}</td>
          <td>${renderProgress(row.checkProgress)}</td>
          <td>${row.startDate}</td>
          <td>${row.endDate}</td>
          <td>${renderProgress(row.progress)}</td>
          <td><span class="${row.status === '進行中' ? 'status-ongoing' : 'status-notstart'}">${row.status}</span></td>
          <td>${row.remark}</td>
          <td><span class="action-link" onclick="deleteRow(${idx})">刪除</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function addRow() {
      const newRow = { pinNo: "NEW-0001", itemNo: "00000-NEW", poNo: "-", drawProgress: 0, kApp: "-", checkProgress: 0, startDate: "2026-03-01", endDate: "2026-12-31", progress: 0, status: "未開始", remark: "-" };
      initialData.push(newRow);
      renderTable(initialData);
    }

    function deleteRow(idx) {
      initialData.splice(idx, 1);
      renderTable(initialData);
    }

    function getTableData() {
      return initialData;
    }

    // 初始化渲染
    renderTable(initialData);

    // 匯出 Excel
    function exportExcel() {
      const ws = XLSX.utils.json_to_sheet(initialData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "進度追蹤");
      XLSX.writeFile(wb, `Outsource_Tracing_${new Date().toISOString().slice(0,10)}.xlsx`);
    }
  </script>
</body>
</html>
